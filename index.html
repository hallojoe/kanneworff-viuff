<!doctype html>
<html lang="da">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#173c33" />
    <meta name="description" content="Et visuelt projektværksted til byggeri. Udforsk projekt, byggefaser, byggeplads, jord og kloak samt aflevering i 3D." />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <title>KV Studio · Fra idé til aflevering</title>
    <script>
      try { const t = localStorage.getItem('kv-theme'); document.documentElement.dataset.theme = t === 'dark' || (!t && matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light'; } catch {}
    </script>
  </head>
  <body><div id="root"></div><script type="module" src="/src/main.tsx"></script></body>
